version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - OPENID_CLIENT_ID=${OPENID_CLIENT_ID}
      - OPENID_CLIENT_SECRET=${OPENID_CLIENT_SECRET}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI:-https://quannv.id.vn/api/auth/callback}
      - MINDX_ISSUER=${MINDX_ISSUER:-https://id-dev.mindx.edu.vn}
      - MINDX_JWKS_URI=${MINDX_JWKS_URI:-https://id-dev.mindx.edu.vn/jwks}
      - MINDX_AUTH_ENDPOINT=${MINDX_AUTH_ENDPOINT:-https://id-dev.mindx.edu.vn/auth}
      - MINDX_TOKEN_ENDPOINT=${MINDX_TOKEN_ENDPOINT:-https://id-dev.mindx.edu.vn/token}
    networks:
      - blog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile
    container_name: blog-frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blog-network
    restart: unless-stopped

networks:
  blog-network:
    driver: bridge

volumes:
  backend-data:
