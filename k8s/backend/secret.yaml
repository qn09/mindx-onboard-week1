apiVersion: v1
kind: Secret
metadata:
  name: blog-backend-secrets
  namespace: default
  labels:
    app: blog-backend
type: Opaque
stringData:
  # Replace with actual values
  openid-client-id: "your-client-id"
  openid-client-secret: "your-client-secret"
  # Or use base64 encoding:
  # echo -n "your-client-id" | base64
